name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-launcher:
    name: Build Hume launcher (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools 34.0.0 and platform android-34
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: hume
        run: ./build.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hume-debug-apk
          path: hume/build/tvos-home.apk
          retention-days: 7
          if-no-files-found: error

  lint-shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          shellcheck -S warning \
            scripts/kit.sh LANCER.sh LANCER.command hume/build.sh hume/build-win.sh

  lint-powershell:
    name: PowerShell syntax check
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse kit.ps1
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/kit.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
