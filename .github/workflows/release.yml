name: Release Hume launcher

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.2)'
        required: true
        type: string
      version_code:
        description: 'Version code (e.g. 10002, must be higher than the last release)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-sign-release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Default packages include the legacy "tools" package, which Google removed from the
          # SDK repository; platform-tools alone is enough, build-tools/platform come next.
          packages: platform-tools

      - name: Install build-tools 34.0.0 and platform android-34
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: hume
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: ./build.sh

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Tag release
        run: |
          git tag "v${{ inputs.version_name }}"
          git push origin "v${{ inputs.version_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: ProxFibre launcher v${{ inputs.version_name }}
          generate_release_notes: true
          files: hume/build/tvos-home.apk
